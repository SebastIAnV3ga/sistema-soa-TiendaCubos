services:
  - type: web
    name: sistema-soa-tienda-cubos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_CUSTOMER_PASSWORD
        generateValue: true
      - key: SOA_DB
        value: /tmp/sistema.db
      - key: SECURE_COOKIES
        value: "true"
